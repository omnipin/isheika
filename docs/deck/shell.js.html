<script>
  const slides = Array.from(document.querySelectorAll('.slide'));
  // Number the slides from their DOM order, so inserting one never leaves a
  // stale hand-written figure behind. Slide 1 is the title and stays blank.
  slides.forEach((s, k) => { const n = s.querySelector('.num'); if (n) n.textContent = String(k + 1).padStart(2, '0'); });
  const fill = document.getElementById('fill');
  const counter = document.getElementById('counter');
  let i = 0;

  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => s.classList.toggle('on', k === i));
    fill.style.width = ((i + 1) / slides.length * 100) + '%';
    counter.textContent = (i + 1) + ' / ' + slides.length;
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
    fit(slides[i]);
  }

  // Slides carry very different amounts of content, and the stage is a fixed
  // 16:9 box that clips. Rather than let a dense slide silently lose its last
  // line, shrink that slide's type until it fits. Slides with room to spare
  // are untouched, so the designed sizes hold wherever they can.
  function fit(s) {
    if (!s) return;
    s.style.setProperty('--fit', '1');
    // Measure the tallest overflow, not just the slide's own: a wide table or a
    // long line can spill out of its own box while the slide still measures as
    // fitting.
    const over = () => s.scrollHeight > s.clientHeight + 1
      || Array.from(s.children).some(c => c.scrollHeight > c.clientHeight + 1);
    for (let k = 1; k > 0.55 && over(); k -= 0.02) {
      s.style.setProperty('--fit', k.toFixed(2));
    }
  }

  document.getElementById('next').addEventListener('click', () => show(i + 1));
  document.getElementById('prev').addEventListener('click', () => show(i - 1));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(i + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(i - 1); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
  });

  document.getElementById('stage').addEventListener('click', e => {
    if (e.target.closest('a, button, .scroll, pre')) return;
    show(i + (e.clientX > e.currentTarget.getBoundingClientRect().left + e.currentTarget.offsetWidth / 2 ? 1 : -1));
  });

  let x0 = null;
  document.getElementById('stage').addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; }, {passive: true});
  document.getElementById('stage').addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1));
    x0 = null;
  }, {passive: true});

  addEventListener('resize', () => fit(slides[i]));

  const start = parseInt(location.hash.slice(1), 10);
  show(Number.isFinite(start) && start > 0 ? start - 1 : 0);
  // Re-measure once layout has settled, and again when the fonts land — the
  // first pass can run against fallback metrics and under-shrink.
  requestAnimationFrame(() => fit(slides[i]));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit(slides[i]));
</script>
